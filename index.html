<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SnipCloud — a serverless URL shortener built on AWS Lambda, API Gateway and DynamoDB."
    />
    <meta name="theme-color" content="#000000" />
    <title>SnipCloud — Serverless URL Shortener</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('snipcloud.theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
        } catch (error) {
          // Keep the dark default declared on <html>.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
